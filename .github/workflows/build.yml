name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "26.1.2"
            api: "0.155.2+26.1.2"
          - mc: "26.2"
            api: "0.161.0+26.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Build
        run: gradle build -Pminecraft_version=${{ matrix.mc }} -Pfabric_api_version=${{ matrix.api }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: custom-rpg-hud-mc${{ matrix.mc }}
          path: build/libs/*.jar
